<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>DM Check | Wall Brokers</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0a0a; font-family:'Courier New',monospace; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
    .card { width:100%; max-width:400px; background:rgba(20,20,20,0.98); border:1px solid rgba(198,242,33,0.15); border-radius:16px; padding:32px 24px; text-align:center; position:relative; z-index:1; }
    .title { font-size:0.95rem; font-weight:700; color:#C6F221; margin-bottom:6px; }
    .subtitle { font-size:0.62rem; color:#aaa; margin-bottom:24px; }
    .input { width:100%; padding:14px 16px; background:rgba(255,255,255,0.05); border:1px solid rgba(198,242,33,0.2); border-radius:10px; color:#fff; font-family:'Courier New',monospace; font-size:0.8rem; margin-bottom:10px; outline:none; text-align:center; }
    .input:focus { border-color:#C6F221; }
    .input::placeholder { color:#555; }
    .btn { width:100%; padding:14px; background:#C6F221; color:#000; border:none; border-radius:10px; font-family:'Courier New',monospace; font-size:0.8rem; font-weight:700; cursor:pointer; transition:all 0.2s; }
    .btn:hover { background:#d4ff33; }
    .btn:disabled { background:#333; color:#666; cursor:not-allowed; }
    .error { font-size:0.62rem; color:#ef5350; text-align:center; min-height:16px; margin-top:8px; }
    .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(0,0,0,0.2); border-top-color:#000; border-radius:50%; animation:spin 0.6s linear infinite; vertical-align:middle; margin-right:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .result { display:none; margin-top:20px; padding:20px; border-radius:12px; text-align:center; }
    .result-new { background:rgba(198,242,33,0.08); border:1px solid rgba(198,242,33,0.3); }
    .result-used { background:rgba(239,83,80,0.08); border:1px solid rgba(239,83,80,0.3); }
    .result-icon { font-size:2.5rem; margin-bottom:8px; }
    .result-title { font-size:0.85rem; font-weight:700; margin-bottom:4px; }
    .result-new .result-title { color:#C6F221; }
    .result-used .result-title { color:#ef5350; }
    .result-desc { font-size:0.6rem; color:#888; margin-bottom:12px; }
    .profile-link { display:inline-block; padding:10px 20px; background:#1DA1F2; color:#fff; border-radius:8px; text-decoration:none; font-family:'Courier New',monospace; font-size:0.7rem; font-weight:700; transition:all 0.2s; }
    .profile-link:hover { background:#1a8cd8; }

    .history { margin-top:24px; text-align:left; }
    .history-title { font-size:0.65rem; color:#666; margin-bottom:8px; text-align:center; }
    .history-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.6rem; }
    .history-user { color:#C6F221; font-weight:700; }
    .history-status { font-weight:700; }
    .history-new { color:#C6F221; }
    .history-used { color:#ef5350; }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">Collab DM Check</div>
    <div class="subtitle">Check if a user has already been DM'd by our team</div>

    <input type="text" class="input" id="dm-username" placeholder="@username" autocomplete="off">
    <div class="error" id="dm-error"></div>
    <button class="btn" id="dm-btn" onclick="checkDm()">
      Check Username
    </button>

    <div class="result" id="dm-result-new">
      <div class="result-icon">✅</div>
      <div class="result-title">Safe to DM</div>
      <div class="result-desc">This user hasn't been contacted yet.</div>
      <a class="profile-link" id="dm-profile-link" href="#" target="_blank" rel="noopener">View Profile →</a>
    </div>

    <div class="result" id="dm-result-used">
      <div class="result-icon">⚠️</div>
      <div class="result-title">Already DM'd</div>
      <div class="result-desc">This user was already contacted by a team member.</div>
    </div>

    <div class="history" id="dm-history"></div>
  </div>

  <script>
    const DM_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbydYa2p5RMATHrp__0_FmT7Q7JcakHHrPevWktJd5yu3fxN_dvHsGPLJtcTMpBu4HgqZw/exec';

    async function checkUsername(username) {
      try {
        var resp = await fetch(DM_SHEETS_URL + '?type=username&value=' + encodeURIComponent(username), { mode: 'cors', signal: AbortSignal.timeout(10000) });
        var data = await resp.json();
        return data.exists;
      } catch(e) { return true; }
    }

    async function saveUsername(username) {
      try {
        fetch(DM_SHEETS_URL, {
          method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, timestamp: new Date().toISOString() })
        }).catch(function(){});
      } catch(e) {}
    }

    function getHistory() {
      try { return JSON.parse(localStorage.getItem('dm_history') || '[]'); } catch(e) { return []; }
    }

    function addHistory(username, isNew) {
      var h = getHistory();
      h.unshift({ user: username, isNew: isNew, time: new Date().toLocaleString('en-BD', { timeZone: 'Asia/Dhaka' }) });
      if (h.length > 20) h = h.slice(0, 20);
      localStorage.setItem('dm_history', JSON.stringify(h));
    }

    function renderHistory() {
      var h = getHistory();
      var el = document.getElementById('dm-history');
      if (h.length === 0) { el.innerHTML = ''; return; }
      var html = '<div class="history-title">Recent Checks</div>';
      for (var i = 0; i < h.length; i++) {
        html += '<div class="history-item"><span class="history-user">' + h[i].user + '</span><span class="history-status ' + (h[i].isNew ? 'history-new' : 'history-used') + '">' + (h[i].isNew ? 'NEW' : 'DM\'D') + '</span></div>';
      }
      el.innerHTML = html;
    }

    async function checkDm() {
      var input = document.getElementById('dm-username');
      var errEl = document.getElementById('dm-error');
      var btn = document.getElementById('dm-btn');
      var resultNew = document.getElementById('dm-result-new');
      var resultUsed = document.getElementById('dm-result-used');

      resultNew.style.display = 'none';
      resultUsed.style.display = 'none';
      errEl.textContent = '';

      var u = input.value.trim();
      if (!u) { errEl.textContent = 'Enter a username.'; return; }
      if (!u.startsWith('@')) u = '@' + u;
      u = u.trim();
      if (u === '@') { errEl.textContent = 'Enter a valid username.'; return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Checking...';

      var exists = await checkUsername(u);

      btn.disabled = false;
      btn.textContent = 'Check Username';

      if (exists) {
        resultUsed.style.display = 'block';
        addHistory(u, false);
      } else {
        saveUsername(u);
        document.getElementById('dm-profile-link').href = 'https://x.com/' + u.replace('@', '');
        resultNew.style.display = 'block';
        addHistory(u, true);
      }

      renderHistory();
      input.value = '';
    }

    document.getElementById('dm-username').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkDm();
    });

    renderHistory();
  </script>

</body>
</html>
