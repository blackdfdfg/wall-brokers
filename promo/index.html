<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall Brokers - Promo</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 800px;
      height: 450px;
      overflow: hidden;
      font-family: 'Space Mono', monospace;
      background-color: #1a1510;
      background-image:
        repeating-linear-gradient(0deg, transparent 0px, transparent 39px, #120f0a 39px, #120f0a 41px),
        repeating-linear-gradient(90deg, transparent 0px, transparent 79px, #120f0a 79px, #120f0a 81px);
      background-size: 100% 40px, 80px 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, transparent 0px, transparent 39px, rgba(50,38,28,0.5) 39px, rgba(50,38,28,0.5) 41px),
        repeating-linear-gradient(90deg, transparent 0px, transparent 79px, rgba(50,38,28,0.3) 79px, rgba(50,38,28,0.3) 81px),
        radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.5) 100%);
      background-size: 100% 40px, 80px 80px, 100% 100%;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 30px;
    }

    .closed-main {
      font-size: 1.4rem;
      font-weight: 700;
      color: #C6F221;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-shadow: 0 0 20px rgba(198,242,33,0.3), 0 2px 4px rgba(0,0,0,0.8);
      line-height: 1.6;
    }

    .divider-line {
      width: 40px;
      height: 1px;
      background: rgba(198,242,33,0.25);
      margin: 20px 0;
    }

    .notify-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(198,242,33,0.06);
      border: 1px solid rgba(198,242,33,0.15);
      border-radius: 100px;
      margin-bottom: 16px;
    }

    .notify-icon {
      font-size: 1.1rem;
    }

    .notify-text {
      font-size: 0.7rem;
      font-weight: 700;
      color: #C6F221;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .bottom-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .mint-date {
      font-size: 0.75rem;
      font-weight: 700;
      color: #888;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .mint-date span {
      color: #C6F221;
    }

    .sources {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .source {
      font-size: 0.6rem;
      color: #555;
      letter-spacing: 0.06em;
    }

    .source span {
      color: #C6F221;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="closed-main">
      COLLAB CLOSED<br>
      WL APPLICATION CLOSED
    </div>

    <div class="divider-line"></div>

    <div class="notify-box">
      <span class="notify-icon">🔔</span>
      <span class="notify-text">Turn On Notifications</span>
    </div>

    <div class="bottom-info">
      <div class="mint-date">Mint Date: <span>September 7</span></div>
      <div class="sources">
        <div class="source">🌐 <span>wallbrokers.xyz</span></div>
        <div class="source">𝕏 <span>@Wall_Brokers</span></div>
      </div>
    </div>
  </div>
</body>
</html>
